name: validate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-colab.txt -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python scripts/build_notebooks.py --check
      - run: python scripts/execute_notebooks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-results
          path: artifacts/
